<article
  class="group font-geist-mono bg-chili-100 relative aspect-4/6 w-full justify-end overflow-hidden px-3 pt-6 pb-12 text-[#f7fbf2] shadow-xl transition-transform duration-300 hover:-translate-y-1"
>
  <!-- full-bleed product photo -->
  <div class="absolute inset-5">
    <img
      [src]="'haldi_image.png'"
      [alt]="product().name"
      class="h-full w-full object-cover"
    />
  </div>

  <!-- gradient scrim -->
  <div
    class="pointer-events-none absolute inset-0"
    style="
      background: linear-gradient(
        to top,
        rgba(28, 31, 15, 0.88) 0%,
        rgba(28, 31, 15, 0.7) 18%,
        rgba(28, 31, 15, 0.35) 42%,
        rgba(28, 31, 15, 0.05) 68%,
        rgba(28, 31, 15, 0) 82%
      );
    "
  ></div>

  <!-- goto product button -->
  <button
    type="button"
    [routerLink]="['/product-detail', product().slug]"
    class="shadow-chili-100 absolute inset-0 flex cursor-pointer items-center justify-center border-0 bg-transparent opacity-0 shadow-2xl transition-opacity duration-300 group-hover:opacity-100"
    [attr.aria-label]="'View ' + product().name"
  >
    <span
      class="flex h-14 w-14 items-center justify-center rounded-full bg-[#f7fbf2] shadow-[0_4px_24px_rgba(0,0,0,0.45)]"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-6 w-6 text-[#1c1f0f]"
      >
        <line
          x1="5"
          y1="12"
          x2="19"
          y2="12"
        />
        <polyline points="12 5 19 12 12 19" />
      </svg>
    </span>
  </button>

  <!-- category tag -->
  <span
    class="font-geist-mono absolute top-8 right-8 bg-[rgba(247,251,242,0.92)] px-2.5 py-1.5 text-[10px] tracking-[0.2em] text-[#1c1f0f] uppercase backdrop-blur-xs"
  >
    {{ product().category.name }}
  </span>

  <!-- text block -->
  <div class="absolute right-6 bottom-5.5 left-6 flex flex-col gap-1.5">
    <div class="flex flex-col">
      <h3
        class="font-instrument m-0 line-clamp-1 max-h-[1.5em] overflow-hidden text-4xl leading-none tracking-[-0.015em] transition-[max-height] duration-500 ease-in-out [text-shadow:0_1px_24px_rgba(0,0,0,0.35)] group-hover:line-clamp-none group-hover:max-h-40"
      >
        {{ product().name.replace('HSI ', '') }}
      </h3>
      <p class="font-geist m-0 max-w-75 text-[13px] leading-normal text-pretty uppercase opacity-[0.82]">
        {{ product().generic_name }}
      </p>
    </div>
    <p
      class="font-geist m-0 max-h-40 max-w-75 overflow-hidden text-[13px] leading-normal opacity-[0.82] transition-[max-height] duration-500 ease-in-out md:line-clamp-1 md:max-h-[1.5em] md:group-hover:line-clamp-none md:group-hover:max-h-40"
    >
      {{ product().short_description ?? product().description }}
    </p>
  </div>
</article>
