<section
  class="border-chili-500 font-geist-mono relative flex min-h-full flex-col border-b p-8 tracking-wider md:border-r md:border-b-0"
>
  <aside class="w-full shrink-0 md:w-48">
    <div class="sticky top-32 space-y-8">
      <div>
        <h3 class="font-instrument mb-6 text-[24px] leading-[0.95] tracking-[-0.01em]">Categories</h3>
        <ul class="space-y-4">
          @for (category of displayCategories(); track category.id) {
            <li>
              <button
                (click)="selectCategory(category)"
                class="group flex cursor-pointer items-center gap-2 text-[14px] transition-colors"
                [class.text-chili-600]="isSelected(category)"
                [class.text-[rgba(26,23,20,0.6)]]="!isSelected(category)"
                [class.hover:text-chili-600]="!isSelected(category)"
              >
                <span
                  class="h-1.5 w-1.5 transition-colors"
                  [class.bg-chili-600]="isSelected(category)"
                  [class.bg-transparent]="!isSelected(category)"
                  [class.group-hover:bg-chili-600]="!isSelected(category)"
                ></span>
                {{ category.name }}
              </button>
            </li>
          }
        </ul>
      </div>
    </div>
  </aside>
</section>
